<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 200" fill="none">
  <defs>
    <linearGradient id="wallet" x1="180" y1="45" x2="300" y2="150" gradientUnits="userSpaceOnUse">
      <stop stop-color="#173e72"/>
      <stop offset="1" stop-color="#0b1d39"/>
    </linearGradient>
    <linearGradient id="edge" x1="160" y1="55" x2="318" y2="146" gradientUnits="userSpaceOnUse">
      <stop stop-color="#45d7f5"/>
      <stop offset=".55" stop-color="#1680ff"/>
      <stop offset="1" stop-color="#8a7cff"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="matrix(0 92 -178 0 240 106)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1680ff" stop-opacity=".24"/>
      <stop offset="1" stop-color="#1680ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft-glow" x="145" y="34" width="190" height="145" color-interpolation-filters="sRGB" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <style>
      .wallet-body { animation: wallet-float 4s ease-in-out infinite; }
      .wallet-orbit { stroke-dasharray: 5 8; animation: wallet-connect 5s linear infinite; }
      .wallet-node { animation: wallet-pulse 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .wallet-node:nth-of-type(2) { animation-delay: .5s; }
      .wallet-node:nth-of-type(3) { animation-delay: 1s; }
      @keyframes wallet-float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
      @keyframes wallet-connect { to { stroke-dashoffset: -52; } }
      @keyframes wallet-pulse { 0%, 100% { opacity: .5; transform: scale(.85); } 50% { opacity: 1; transform: scale(1.12); } }
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; }
      }
    </style>
  </defs>
  <path fill="url(#glow)" d="M0 0h480v200H0z"/>
  <ellipse cx="240" cy="164" fill="#1680ff" fill-opacity=".12" rx="105" ry="12"/>
  <circle cx="240" cy="99" r="72" stroke="#1680ff" stroke-opacity=".13"/>
  <circle cx="240" cy="99" r="57" stroke="#1680ff" stroke-opacity=".12" stroke-dasharray="2 7"/>
  <path class="wallet-orbit" d="M77 101h83m160 0h83" stroke="url(#edge)" stroke-linecap="round" stroke-width="2"/>
  <g class="wallet-node" fill="#38c9ed">
    <circle cx="77" cy="101" r="5"/>
    <circle cx="403" cy="101" r="5"/>
  </g>
  <g class="wallet-node" fill="#857cff">
    <circle cx="131" cy="67" r="3.5"/>
    <circle cx="350" cy="139" r="3.5"/>
  </g>
  <path d="M160 82v-9c0-13 10-23 23-23h94c13 0 23 10 23 23v55c0 13-10 23-23 23h-94c-13 0-23-10-23-23V82Z" fill="url(#wallet)" stroke="url(#edge)" stroke-width="2"/>
  <path d="M160 81h105c11 0 20 9 20 20v7h-36c-9 0-16-7-16-16v-3h-73" fill="#102d54" stroke="#388df8" stroke-opacity=".65" stroke-width="1.5"/>
  <g class="wallet-body">
    <rect x="247" y="89" width="51" height="32" rx="10" fill="#0d2342" stroke="#58c9f4" stroke-width="1.5"/>
    <circle cx="262" cy="105" r="3.5" fill="#55daf5"/>
    <path d="M174 67h45" stroke="#a5c8f7" stroke-linecap="round" stroke-opacity=".7" stroke-width="3"/>
    <path d="M174 137h73" stroke="#4a6f9e" stroke-linecap="round" stroke-width="3"/>
  </g>
  <path d="m145 101 9-7v14l-9-7Zm190 0-9-7v14l9-7Z" fill="#57cdf5"/>
  <circle cx="240" cy="100" r="93" stroke="#1680ff" stroke-opacity=".08"/>
</svg>
