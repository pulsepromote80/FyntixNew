<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 200" fill="none">
  <defs>
    <linearGradient id="paper" x1="115" y1="44" x2="310" y2="160" gradientUnits="userSpaceOnUse">
      <stop stop-color="#173e72"/>
      <stop offset="1" stop-color="#0b1d39"/>
    </linearGradient>
    <linearGradient id="pen" x1="257" y1="144" x2="347" y2="55" gradientUnits="userSpaceOnUse">
      <stop stop-color="#40d3ef"/>
      <stop offset=".55" stop-color="#1680ff"/>
      <stop offset="1" stop-color="#9c83ff"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="matrix(0 92 -180 0 240 105)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1680ff" stop-opacity=".23"/>
      <stop offset="1" stop-color="#1680ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="seal-glow" x="320" y="56" width="110" height="110" color-interpolation-filters="sRGB" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <style>
      .sign-paper { animation: sign-float 4.5s ease-in-out infinite; }
      .sign-stroke { stroke-dasharray: 1; stroke-dashoffset: 1; animation: sign-draw 1.8s cubic-bezier(.2,.8,.2,1) .4s forwards; }
      .sign-seal { transform-box: fill-box; transform-origin: center; animation: sign-seal-pulse 2.8s ease-out 1.4s infinite; }
      @keyframes sign-float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
      @keyframes sign-draw { to { stroke-dashoffset: 0; } }
      @keyframes sign-seal-pulse { 0%, 100% { opacity: .6; transform: scale(.93); } 50% { opacity: 1; transform: scale(1.04); } }
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; }
      }
    </style>
  </defs>
  <path fill="url(#glow)" d="M0 0h480v200H0z"/>
  <ellipse cx="235" cy="165" fill="#1680ff" fill-opacity=".1" rx="123" ry="12"/>
  <g class="sign-paper">
    <rect x="106" y="35" width="202" height="126" rx="16" fill="url(#paper)" stroke="#3288f4" stroke-opacity=".78" stroke-width="1.5"/>
    <rect x="122" y="51" width="31" height="31" rx="9" fill="#1680ff" fill-opacity=".2" stroke="#4aa9ff" stroke-opacity=".6"/>
    <path d="M132 66h11m-5.5-5.5v11" stroke="#76d7ff" stroke-linecap="round" stroke-width="2"/>
    <path d="M165 58h97" stroke="#9fc4f3" stroke-linecap="round" stroke-opacity=".8" stroke-width="3"/>
    <path d="M165 71h68" stroke="#6286b3" stroke-linecap="round" stroke-width="2"/>
    <path d="M123 99h168" stroke="#46698f" stroke-linecap="round" stroke-opacity=".7"/>
    <path d="M123 112h110" stroke="#46698f" stroke-linecap="round" stroke-opacity=".7"/>
    <path d="M123 125h70" stroke="#46698f" stroke-linecap="round" stroke-opacity=".7"/>
    <path d="M128 145c13-16 18 7 30-4 10-9 10-12 14-5s10 12 19 2 13-8 20 0 12 5 20-3" pathLength="1" class="sign-stroke" stroke="#54d8f5" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5"/>
  </g>
  <path d="m276 130 71-71 14 14-71 71-19 5 5-19Z" fill="url(#pen)" stroke="#a0eaff" stroke-opacity=".7" stroke-width="1.5"/>
  <path d="m276 130 14 14" stroke="#b5e8ff" stroke-width="1.5"/>
  <circle cx="367" cy="111" r="40" fill="#1680ff" fill-opacity=".16" filter="url(#seal-glow)"/>
  <g class="sign-seal">
    <circle cx="367" cy="111" r="29" fill="#0e2b4e" stroke="#48c9ef" stroke-width="1.5"/>
    <circle cx="367" cy="111" r="22" stroke="#48c9ef" stroke-opacity=".5" stroke-dasharray="2 4"/>
    <path d="m355 111 8 8 16-17" stroke="#64e2bd" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"/>
  </g>
  <circle cx="85" cy="69" r="3" fill="#42c9ed"/>
  <circle cx="391" cy="43" r="3" fill="#8a7cff"/>
  <circle cx="406" cy="151" r="2" fill="#42c9ed" fill-opacity=".7"/>
</svg>
